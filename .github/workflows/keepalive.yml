name: Keep Supabase awake

# A free Supabase project is paused after about seven days with too little
# database activity, which takes the board offline for everyone until someone
# resumes it by hand. This runs a tiny query three times a day so that never
# happens, and fails loudly if the project is already down, so you hear about
# it from GitHub rather than from a confused collaborator.

on:
  schedule:
    # Three times a day, at an odd minute. Scheduled jobs on the hour are the
    # most likely to be delayed by GitHub's own queue.
    - cron: "17 2,10,18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run one query against the database
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -u
          if [ -z "${URL:-}" ] || [ -z "${KEY:-}" ]; then
            echo "::error::VITE_SUPABASE_URL or VITE_SUPABASE_ANON_KEY is not set."
            echo "Add them under Settings, Secrets and variables, Actions."
            exit 1
          fi

          # Reading a real table is what counts as database activity. Row level
          # security means this returns an empty list, which is fine: the query
          # still runs, and a 200 proves the whole stack is awake.
          code=$(curl -sS --max-time 30 -o /tmp/body -w '%{http_code}' \
            -H "apikey: ${KEY}" \
            -H "Authorization: Bearer ${KEY}" \
            "${URL}/rest/v1/projects?select=id&limit=1") || {
              echo "::error::Could not reach ${URL}. The project may be paused."
              exit 1
            }

          echo "HTTP ${code}"
          head -c 300 /tmp/body; echo

          if [ "${code}" != "200" ]; then
            echo "::error::Supabase answered ${code} instead of 200. If it is 540 or a timeout, the project is paused: open the Supabase dashboard and click Resume project."
            exit 1
          fi
          echo "Database is awake."
